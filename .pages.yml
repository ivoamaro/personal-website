media:
  input: public/uploads
  output: /uploads
components:
  status:
    type: select
    options:
      values: [Draft, Review, Published]
  link:
    type: object
    label: Link
    list: true
    fields:
      - name: title
        type: string
        label: Title
      - name: href
        type: string
      - name: category
        type: select
        options:
          values: [Email, Tel, Hyperlink]
  seo:
    type: object
    label: SEO
    fields:
      - name: title
        type: string
        options:
          maxLength: 60
      - name: description
        type: text
        options:
          maxLength: 160
      - name: schema
        type: code
        label: Structured Data (Schema.org)
        description: "JSON-LD structured data for rich results in search engines."
        options:
          format: javascript

content:
  - name: work
    label: Work
    type: collection
    path: content/work
    fields:
      - name: status
        component: status
        label: Status
      - name: title
        type: string
        label: Title
      - name: slug
        type: string
        label: Slug
      - name: body
        type: rich-text

  - name: site-settings
    label: Site Settings
    path: content/site-settings.json
    type: file
    fields:
      - name: seo
        component: seo
        label: SEO
