media:
  input: src/assets
  output: assets
components:
  link:
    type: object
    label: Link
    fields:
     - name: title
       type: string
     - name: href
       type: string
     - name: category
       type: select
       options:
         values: [Email, Tel, Hyperlink]
  seo:
    type: object
    label: SEO
    fields:
      - name: title
        type: string
        options:
          maxLength: 60
      - name: description
        type: text
        options:
          maxLength: 160
      - name: schema
        type: code
        label: Structured Data (Schema.org)
        description: "JSON-LD structured data for rich results in search engines."
        options:
          format: javascript

content:
  - name: pages
    label: Pages
    type: collection
    path: docs
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
      - name: seo
        component: seo
        label: Meta
      - name: button
        component: link
        label: Button
